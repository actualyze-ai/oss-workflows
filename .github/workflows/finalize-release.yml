name: Finalize release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, such as v1.2.3. Its npm version must already be public; a staged publish must be approved first.
        type: string
        required: true
      release-workflow:
        description: File name of the calling repository's workflow that calls release-npm.yml.
        type: string
        default: release.yml

permissions: {}

jobs:
  finalize:
    name: finalize release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out the release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
          sparse-checkout: tools

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Find the release run for the tag
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          WORKFLOW: ${{ inputs.release-workflow }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag"
            exit 1
          fi
          # Use the full tag ref: "tags/<tag>" returns 422, and a bare name
          # could match a branch.
          tag_sha="$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)"
          runs="$(TAG_SHA="$tag_sha" gh api --paginate \
            "repos/$REPO/actions/workflows/$WORKFLOW/runs?event=push&branch=$TAG&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == env.TAG_SHA) | .id')"
          count="$(grep -c . <<<"$runs" || true)"
          if [[ "$count" -ne 1 ]]; then
            echo "::error::Expected one successful $WORKFLOW run for $TAG at $tag_sha, found $count"
            exit 1
          fi
          echo "run-id=$runs" >> "$GITHUB_OUTPUT"

      - name: Download the build record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: record
          run-id: ${{ steps.run.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Read the build record
        id: record
        working-directory: record
        env:
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          tarballs=(*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "::error::Expected one tarball in the build record, found ${#tarballs[@]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          sha256sum --check "$tarball.sha256"
          manifest="$(tar -xzOf "$tarball" package/package.json)"
          name="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "$manifest")"
          version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$manifest")"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::The recorded tarball is version $version, not $TAG"
            exit 1
          fi
          {
            echo "integrity=sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check that the npm version is public with provenance
        env:
          NAME: ${{ steps.record.outputs.name }}
          VERSION: ${{ steps.record.outputs.version }}
          INTEGRITY: ${{ steps.record.outputs.integrity }}
        run: |
          if ! dist="$(npm view "$NAME@$VERSION" dist --json)"; then
            echo "::error::$NAME@$VERSION is not public. If the release was staged, approve it with npm stage approve first."
            exit 1
          fi
          node -e '
            const dist = JSON.parse(process.argv[1]);
            const integrity = process.argv[2];
            if (!dist.attestations?.provenance) {
              console.log("::error::The registry has no provenance attestation for this version");
              process.exit(1);
            }
            if (dist.integrity !== integrity) {
              console.log("::error::The registry tarball has integrity " + dist.integrity + "; the build recorded " + integrity);
              process.exit(1);
            }
            console.log("Provenance: " + dist.attestations.provenance.predicateType);
          ' "$dist" "$INTEGRITY"

      # npm is the only distribution channel: the draft must carry no
      # assets, so there is no file to swap before it is published.
      - name: Check the draft GitHub Release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          release_id="$(workflows/tools/verify-release-assets.sh draft)"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          TAG: ${{ inputs.tag }}
        run: |
          make_latest=true
          if [[ "$TAG" == *-* ]]; then
            make_latest=false
          fi
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" \
            -F draft=false -f make_latest="$make_latest" --jq .html_url

      # Assets can be added until the release is published; with release
      # immutability on, what this step sees is final.
      - name: Check the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: workflows/tools/verify-release-assets.sh published
